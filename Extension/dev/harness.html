<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dissolve Harness</title>
<!-- Styles for the fake site live in #site-css so the snapshot can embed them. -->
<style id="site-css">
  #site { font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #f1f1f1; background: #0f0f0f; min-height: 100vh; }
  #site header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #181818; position: sticky; top: 0; }
  #site .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
  #site .logo span { color: #ff4e45; }
  #site .search { flex: 1; max-width: 520px; height: 34px; border-radius: 17px; background: #121212; border: 1px solid #303030; }
  #site main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 24px; padding: 20px; }
  #site .player { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #000; display: block; }
  #site h1 { font-size: 20px; margin: 12px 0 4px; }
  #site .meta { color: #aaa; }
  #site .side { display: grid; gap: 12px; align-content: start; }
  #site .card { display: grid; grid-template-columns: 168px 1fr; gap: 8px; }
  #site .thumb { aspect-ratio: 16 / 9; border-radius: 8px; }
  #site .title { font-weight: 600; }
  #site .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 0 20px 40px; }
  #site .grid .thumb { width: 100%; }
</style>
<style>
  body { margin: 0; }
  #controls {
    position: fixed; right: 16px; bottom: 16px; z-index: 1000; width: 280px; padding: 14px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #222; background: #fffdf6;
    border: 2px solid #222; border-radius: 10px; box-shadow: 4px 4px 0 rgba(0,0,0,.35);
  }
  #controls h2 { font-size: 13px; margin: 0 0 10px; }
  #controls .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  #controls button { font: inherit; padding: 4px 8px; border: 1px solid #222; border-radius: 4px; background: #fff; cursor: pointer; }
  #controls button.primary { background: #E8C15A; }
  #controls label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  #controls input[type=range] { width: 120px; }
  #controls select { font: inherit; max-width: 150px; }
  #status { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #999; white-space: pre-wrap; color: #555; }
  kbd { border: 1px solid #999; border-radius: 3px; padding: 0 3px; font: inherit; }
</style>
</head>
<body>

<div id="site">
  <header>
    <div class="logo">Scroll<span>scape</span></div>
    <div class="search"></div>
  </header>
  <main>
    <section>
      <video class="player" id="player" muted playsinline></video>
      <h1>You Won't Believe What This Cat Did Next (Part 47)</h1>
      <div class="meta">3.2M views · 2 hours ago</div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
  <div class="grid" id="grid"></div>
</div>

<div id="controls">
  <h2>FocusPet dissolve harness</h2>
  <div class="row">
    <button id="nudge" class="primary" title="N">Simulate nudge</button>
    <button id="hold" title="H">Hold</button>
    <button id="dissolve" title="D">Dissolve</button>
    <button id="reset" title="R">Reset</button>
  </div>
  <label>Pet <select id="pet"></select></label>
  <label>Mode
    <select id="mode">
      <option value="scatter">scatter (snapshot)</option>
      <option value="cover">cover (no snapshot)</option>
    </select>
  </label>
  <label>Duration <input id="duration" type="range" min="500" max="3000" step="100"><span id="durationOut"></span></label>
  <label>Tile px <input id="tile" type="range" min="4" max="24" step="2"><span id="tileOut"></span></label>
  <label>Gold % <input id="gold" type="range" min="0" max="20" step="1"><span id="goldOut"></span></label>
  <label>Reduced motion <input id="reduced" type="checkbox"></label>
  <div id="status">Keys: <kbd>N</kbd> nudge · <kbd>H</kbd> hold · <kbd>D</kbd> dissolve · <kbd>R</kbd> reset</div>
</div>

<script src="../src/dissolve.js"></script>
<script>
// Mirrors Pet.swift (name, catchphrase, one phrase). In the extension these arrive from the app.
const PETS = [
  { name: 'St. Alphonsus Liguori', catchphrase: 'This is not Liguorian!', phrase: 'I vowed never to waste a moment. Shall we try it together?' },
  { name: 'St. Isidore of Seville', catchphrase: 'Even the patron of the internet says log off!', phrase: 'Close the tab; open a book.' },
  { name: 'St. Clare of Assisi', catchphrase: "As patron of screens, I've seen enough.", phrase: 'Less screen, more serene.' },
  { name: 'St. Benedict', catchphrase: 'Idleness is the enemy of the soul!', phrase: 'Ora et labora. Right now, mostly labora.' },
  { name: 'St. Thomas Aquinas', catchphrase: 'I answer that: close the tab.', phrase: 'I kept four scribes busy at once. You can manage one tab.' },
];
// Same beat as the app: hand rises ~2.2s after he appears (walk 1.6s + idle 0.6s).
const HOLD_AT_MS = 2200, SWEEP_AFTER_HOLD_MS = 2000;

const $ = id => document.getElementById(id);
const D = FocusPetDissolve;

// ── Fake site content ──────────────────────────────────────────────────────
const hues = [12, 200, 280, 40, 150, 330, 90, 260, 0, 180, 220, 300];
const titles = ['Top 10 Desk Setups', 'I Tried Every Snack', 'Speedrun Any%', 'Reacting to Reactions',
  'Tiny Apartment Tour', 'The Ultimate Tier List', 'Lofi Beats to Scroll To', '24 Hours in a Treehouse',
  'Unboxing the Unboxing', 'Why Is Nobody Talking About This', 'Day in the Life', 'Ranking Every Door'];
const thumb = h => `background: linear-gradient(135deg, hsl(${h} 70% 55%), hsl(${h + 40} 60% 30%));`;
$('side').innerHTML = titles.slice(0, 6).map((t, i) =>
  `<div class="card"><div class="thumb" style="${thumb(hues[i])}"></div><div><div class="title">${t}</div><div class="meta">${(i + 2) * 117}K views</div></div></div>`).join('');
$('grid').innerHTML = titles.map((t, i) =>
  `<div><div class="thumb" style="${thumb(hues[(i + 5) % hues.length])}"></div><div class="title">${t}</div><div class="meta">${(i + 1) * 43}K views</div></div>`).join('');

// A real, playing <video> (fed by a canvas) so hold() has media to pause.
const frameCanvas = document.createElement('canvas');
frameCanvas.width = 640; frameCanvas.height = 360;
const fc = frameCanvas.getContext('2d');
(function paint(t) {
  const g = fc.createLinearGradient(0, 0, 640, 360);
  g.addColorStop(0, `hsl(${(t / 30) % 360} 70% 45%)`);
  g.addColorStop(1, `hsl(${(t / 30 + 120) % 360} 70% 30%)`);
  fc.fillStyle = g; fc.fillRect(0, 0, 640, 360);
  fc.fillStyle = '#fff'; fc.font = 'bold 42px system-ui';
  fc.fillText('▶ ' + (t / 1000).toFixed(1) + 's', 30, 330);
  requestAnimationFrame(paint);
})(0);
const player = $('player');
player.srcObject = frameCanvas.captureStream(30);
player.play().catch(() => {});

// ── Snapshot: stands in for chrome.tabs.captureVisibleTab ──────────────────
// Serializes the visible part of #site into an SVG <foreignObject> image. Videos don't serialize,
// so each is swapped for a still of its current frame.
async function snapshotPage() {
  const W = innerWidth, H = innerHeight;
  const clone = $('site').cloneNode(true);
  clone.querySelectorAll('video').forEach(v => {
    const img = document.createElement('img');
    img.className = v.className;
    img.src = frameCanvas.toDataURL('image/jpeg', 0.85);
    v.replaceWith(img);
  });
  const css = $('site-css').textContent;
  const xhtml = new XMLSerializer().serializeToString(clone);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">` +
    `<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px;overflow:hidden">` +
    `<style>${css}</style><div style="transform:translate(${-scrollX}px,${-scrollY}px);width:${document.documentElement.clientWidth}px">${xhtml}</div></div></foreignObject></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ── Controls ───────────────────────────────────────────────────────────────
const prefs = (() => { try { return JSON.parse(localStorage.getItem('fp-harness') || '{}'); } catch { return {}; } })();
$('pet').innerHTML = PETS.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
$('pet').value = prefs.pet ?? 0;
$('mode').value = prefs.mode ?? 'scatter';
$('duration').value = prefs.duration ?? D.defaults.durationMs;
$('tile').value = prefs.tile ?? D.defaults.tileSize;
$('gold').value = prefs.gold ?? D.defaults.goldFraction * 100;
$('reduced').checked = prefs.reduced ?? false;

function syncOutputs() {
  $('durationOut').textContent = $('duration').value + 'ms';
  $('tileOut').textContent = $('tile').value;
  $('goldOut').textContent = $('gold').value + '%';
  try {
    localStorage.setItem('fp-harness', JSON.stringify({ pet: $('pet').value, mode: $('mode').value,
      duration: $('duration').value, tile: $('tile').value, gold: $('gold').value, reduced: $('reduced').checked }));
  } catch {}
}
document.querySelectorAll('#controls select, #controls input').forEach(i => i.addEventListener('input', syncOutputs));
syncOutputs();

let timers = [];
const status = msg => { $('status').textContent = msg; console.log('[harness]', msg); };

function doHold() {
  const r = D.hold();
  status(`hold → state=${D.state}, paused ${r.paused} media`);
}

async function doDissolve() {
  const pet = PETS[+$('pet').value];
  const t0 = performance.now();
  const snapshot = $('mode').value === 'scatter' ? await snapshotPage() : null;
  const result = await D.dissolve({
    snapshot,
    durationMs: +$('duration').value,
    tileSize: +$('tile').value,
    goldFraction: +$('gold').value / 100,
    reducedMotion: $('reduced').checked || undefined,
    petName: pet.name, catchphrase: pet.catchphrase, phrase: pet.phrase,
    onReturn: () => { player.play().catch(() => {}); status('returned anyway → state=' + D.state); },
  });
  status(`dissolve → ${JSON.stringify(result)} in ${Math.round(performance.now() - t0)}ms, state=${D.state}`);
}

function reset() {
  timers.forEach(clearTimeout); timers = [];
  D.release();
  player.play().catch(() => {});
  status('reset → state=' + D.state);
}

function simulateNudge() {
  reset();
  status('pet walking in…');
  timers.push(setTimeout(doHold, HOLD_AT_MS));
  timers.push(setTimeout(doDissolve, HOLD_AT_MS + SWEEP_AFTER_HOLD_MS));
}

$('nudge').onclick = simulateNudge;
$('hold').onclick = doHold;
$('dissolve').onclick = doDissolve;
$('reset').onclick = reset;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input, select')) return;
  const action = { n: simulateNudge, h: doHold, d: doDissolve, r: reset }[e.key.toLowerCase()];
  if (action) { e.preventDefault(); action(); }
});
</script>
</body>
</html>
