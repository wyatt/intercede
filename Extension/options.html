<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intercede Settings</title>
<link rel="stylesheet" href="src/ui.css">
<style>
  body { padding: 40px 16px 56px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: .03em; }
  h1, .lede { text-align: center; }
  .lede { margin: 0 0 32px; }
  .credit { text-align: center; font-size: 11px; margin: 8px 0 0; }
  .credit a { color: inherit; }
  section { margin-bottom: 36px; }
  h2 { font-size: 14px; margin: 0 0 12px; letter-spacing: .06em; }
  h2::before { content: "\25B8  "; color: var(--accent); }

  /* Sites */
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 2px dashed var(--track); }
  .row .host { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=number] { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
  .row .unit { font-size: 11px; }
  .remove {
    width: 22px; height: 22px; padding: 0; font-size: 14px; line-height: 1;
    background: var(--panel); box-shadow: 2px 2px 0 var(--shadow);
  }
  .remove:active { transform: translate(2px, 2px); }
  .remove:hover { color: var(--over); border-color: var(--over); filter: none; }
  .add { display: flex; gap: 10px; padding: 12px; background: var(--track); border-top: 2px solid var(--line); }
  .add input { flex: 1; }
  .error { color: var(--over); font-size: 13px; margin: 10px 2px 0; min-height: 1em; }
  .empty { padding: 14px 12px; border-bottom: 2px dashed var(--track); }

  /* Patron */
  .patron-box { padding: 16px 12px 12px; }
  .patron-pick { display: flex; align-items: center; gap: 8px; }
  .patron-pick > button { flex: none; padding: 6px 9px; }
  .lineup { position: relative; flex: 1; height: 200px; overflow: hidden; }
  .patron-card {
    position: absolute; left: 50%; top: 50%; width: 127px; height: 150px; margin: -75px 0 0 -63.5px; padding: 0;
    background-color: transparent; border: none; box-shadow: none; transform-origin: center;
    transition: transform 280ms cubic-bezier(.3, .7, .4, 1), opacity 280ms;
  }
  .patron-card:hover { filter: brightness(1.1); }
  .patron-card:active { transform: var(--at); }
  .patron-name { font-weight: 700; text-align: center; margin: 0; }
  .catchphrase { font-size: 15px; text-align: center; margin: 4px 2px 8px; }
</style>
</head>
<body>
<main>
  <h1>Intercede</h1>
  <p class="lede muted">When you've used up a site's daily time, your patron steps in.</p>

  <section aria-labelledby="sites-title">
    <h2 id="sites-title">Tracked sites</h2>
    <div class="sites frame">
      <div id="site-rows"></div>
      <form class="add" id="add-form">
        <input id="new-host" placeholder="Add a site (e.g. twitch.tv)" aria-label="Site to add" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>
    <p class="error" id="add-error" role="alert"></p>
  </section>

  <section aria-labelledby="patron-title">
    <h2 id="patron-title">Your patron</h2>
    <div class="frame patron-box">
      <p class="patron-name" id="patron-name"></p>
      <p class="catchphrase" id="catchphrase"></p>
      <div class="patron-pick">
        <button type="button" id="prev" aria-label="Previous patron">&#9664;</button>
        <div class="lineup" id="patrons" role="radiogroup" aria-labelledby="patron-title"></div>
        <button type="button" id="next" aria-label="Next patron">&#9654;</button>
      </div>
    </div>
  </section>
  <p class="credit muted">Made by <a href="https://wyattsell.com" target="_blank" rel="noopener">Wyatt Sell</a></p>
</main>
<script type="module" src="src/options.js"></script>
</body>
</html>
