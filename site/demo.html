<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intercede demo</title>
<!-- The live demo on the landing page: a screenshot of a video site, and the extension's own
     patron and dissolve scripts (copied into ext/ by `make site`). Chrome's APIs are stubbed below. -->
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; }
  #page { display: block; width: 100vw; height: 100vh; object-fit: cover; object-position: left top; }
</style>
</head>
<body>
<img id="page" src="demo-page.jpg" alt="">

<script>
  // The extension asks its background worker for a screenshot; here the "page" is one image, so
  // the screenshot is that image drawn at the window's size.
  const page = document.getElementById('page');
  globalThis.chrome = {
    runtime: { sendMessage: async message => (message?.type === 'capture' ? snapshotPage() : null) },
  };

  async function snapshotPage() {
    await page.decode().catch(() => {});
    const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
    const c = Object.assign(document.createElement('canvas'), { width: W * dpr, height: H * dpr });
    const k = Math.max(W / page.naturalWidth, H / page.naturalHeight);  // object-fit: cover, top left
    c.getContext('2d').drawImage(page, 0, 0, page.naturalWidth * k * dpr, page.naturalHeight * k * dpr);
    return c.toDataURL('image/jpeg', 0.9);
  }
</script>
<script src="ext/dissolve.js"></script>
<script src="ext/patron.js"></script>
<script type="module">
  import { PATRONS, LAYOUT, randomPhrase } from './ext/patrons.js';

  const VEIL_MS = 6500;  // how long the veil stays before the next patron comes
  let index = 0, timer = 0, run = 0;

  // Sends `slug`'s patron in, then the next one once the veil has been up a while, forever.
  function play(slug) {
    clearTimeout(timer);
    const mine = ++run;
    if (slug) index = Math.max(0, PATRONS.findIndex(p => p.slug === slug));
    const patron = PATRONS[index];
    IntercedeDissolve.release();
    IntercedePatron.present({
      sheetUrl: `ext/patrons/${patron.sheet}.png`,
      layout: LAYOUT,
      name: patron.name,
      catchphrase: patron.catchphrase,
      phrase: randomPhrase(patron, 'youtube.com'),
      host: 'youtube.com',
      returnDelayS: 3,
    });
    parent.postMessage({ type: 'intercede-demo', patron: patron.slug }, '*');
    (function waitForVeil() {
      if (mine !== run) return;
      if (IntercedeDissolve.state !== 'veiled') { timer = setTimeout(waitForVeil, 250); return; }
      timer = setTimeout(() => { index = (index + 1) % PATRONS.length; play(); }, VEIL_MS);
    })();
  }

  addEventListener('message', event => {
    if (event.data?.type === 'play') play(event.data.patron);
  });
  play();
</script>
</body>
</html>
