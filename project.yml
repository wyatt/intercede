name: Intercede
options:
  bundleIdPrefix: com.intercede
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Intercede:
    type: application
    platform: macOS
    sources:
      - Intercede
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intercede.app
        INFOPLIST_FILE: Intercede/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Intercede/Resources/Intercede.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Intercede
    dependencies:
      # Native Messaging host for the browser extension, at Contents/Helpers/IntercedeBridge
      - target: IntercedeBridge
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    entitlements:
      path: Intercede/Resources/Intercede.entitlements
      # Declared here because xcodegen regenerates the file; without it AppleScript URL reads fail.
      properties:
        com.apple.security.automation.apple-events: true

  IntercedeBridge:
    type: tool
    platform: macOS
    sources:
      - IntercedeBridge
    settings:
      base:
        PRODUCT_NAME: IntercedeBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.intercede.bridge
        SKIP_INSTALL: YES

  IntercedeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - IntercedeTests
    dependencies:
      - target: Intercede
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intercede.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Intercede.app/Contents/MacOS/Intercede"

schemes:
  Intercede:
    build:
      targets:
        Intercede: all
        IntercedeTests: [test]
    test:
      targets:
        - IntercedeTests
